# Namespace existence is checked by name. This grant cannot enumerate
# namespaces or discover workloads outside the workload-namespace Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-installation-namespace
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames: ["default"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-installation-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-installation-namespace
subjects:
- kind: ServiceAccount
  name: gateway-plugins
  namespace: system
---
# Existing request-path responsibilities have separate namespaced grants.
# HTTPRoute validation stays in the control namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-request-access
  namespace: system
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-request-access
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-request-access
subjects:
- kind: ServiceAccount
  name: gateway-plugins
  namespace: system
---
# ModelClaim wake-up patches only Pods from the workload namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-pod-wake
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-pod-wake
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-pod-wake
subjects:
- kind: ServiceAccount
  name: gateway-plugins
  namespace: system
